[project]
name = "panganwatch"
version = "0.1.0"
description = "A governed food-price and regional-inflation data platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "pymongo>=4.6.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
    "confluent-kafka>=2.3.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "scipy>=1.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "dbt-postgres>=1.11.0",
    "dbt-core>=1.12.5",
]

airflow = [
    "apache-airflow>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panganwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["dbt/panganwatch/dbt_packages/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
